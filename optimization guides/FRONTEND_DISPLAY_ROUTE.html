<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta Optimizada - Mostrador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .content {
            padding: 30px;
        }

        .loading,
        .error {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }

        .error {
            color: #d32f2f;
            background-color: #ffebee;
            border-radius: 8px;
            margin: 20px;
        }

        .info-box {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .info-box h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background-color: white;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            display: block;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .info-value.distance {
            color: #667eea;
            font-size: 24px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            margin-bottom: 15px;
            color: #333;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #f0f0f0;
        }

        .stops-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stop-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #667eea;
            transition: background-color 0.3s;
        }

        .stop-item:hover {
            background-color: #f0f0f0;
        }

        .stop-number {
            min-width: 40px;
            width: 40px;
            height: 40px;
            background-color: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .stop-details strong {
            display: block;
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .stop-coords {
            color: #666;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #5568d3;
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #45a049;
        }

        .start-section {
            text-align: center;
            padding: 60px 20px;
        }

        .start-section button {
            padding: 20px 40px;
            font-size: 18px;
        }

        .hidden {
            display: none;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Encabezado -->
        <div class="header">
            <h1>🗺️ Ruta Optimizada</h1>
            <div class="status-badge" id="statusBadge">Cargando...</div>
        </div>

        <!-- Contenido Principal -->
        <div class="content">
            <!-- Cargando -->
            <div id="loadingSection" class="loading">
                ⏳ Cargando ruta optimizada...
            </div>

            <!-- Error -->
            <div id="errorSection" class="error hidden"></div>

            <!-- Información y Mapa -->
            <div id="mainContent" class="hidden">
                <!-- Mensaje de éxito -->
                <div id="successMessage" class="success-message hidden"></div>

                <!-- Información Resumida -->
                <div class="info-box">
                    <h3>📊 Información de la Ruta</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Distancia Total</span>
                            <span class="info-value distance" id="distanceValue">--</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Total de Paradas</span>
                            <span class="info-value" id="stopsCountValue">--</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Estado</span>
                            <span class="info-value" id="statusValue">--</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Iniciada</span>
                            <span class="info-value" id="startDateValue">--</span>
                        </div>
                    </div>
                </div>

                <!-- Mapa (placeholder para Google Maps) -->
                <div class="section">
                    <h3>📍 Mapa de la Ruta</h3>
                    <div class="map-container" id="mapContainer">
                        <p style="padding: 20px; text-align: center; color: #999;">
                            Mapa interactivo (requiere Google Maps API Key)
                        </p>
                    </div>
                </div>

                <!-- Lista de Paradas -->
                <div class="section">
                    <h3>📋 Orden de Paradas</h3>
                    <ol class="stops-list" id="stopsList"></ol>
                </div>

                <!-- Botones -->
                <div class="button-group">
                    <button class="btn-primary" onclick="reloadRoute()">🔄 Recargar</button>
                    <button class="btn-secondary" onclick="downloadRoute()">📥 Descargar</button>
                </div>
            </div>

            <!-- Botón Iniciar Ruta -->
            <div id="startSection" class="start-section hidden">
                <button class="btn-secondary" id="startBtn" onclick="startRoute()">
                    🚀 Iniciar Ruta
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================

        const CONFIG = {
            baseURL: 'http://localhost:3000',
            routeId: new URLSearchParams(window.location.search).get('routeId') || 'demo-route-id',
            apiKey: 'YOUR_GOOGLE_MAPS_API_KEY'
        };

        // ============================================
        // ELEMENTOS DEL DOM
        // ============================================

        const elements = {
            loadingSection: document.getElementById('loadingSection'),
            errorSection: document.getElementById('errorSection'),
            mainContent: document.getElementById('mainContent'),
            startSection: document.getElementById('startSection'),
            statusBadge: document.getElementById('statusBadge'),
            distanceValue: document.getElementById('distanceValue'),
            stopsCountValue: document.getElementById('stopsCountValue'),
            statusValue: document.getElementById('statusValue'),
            startDateValue: document.getElementById('startDateValue'),
            stopsList: document.getElementById('stopsList'),
            successMessage: document.getElementById('successMessage'),
            startBtn: document.getElementById('startBtn'),
            mapContainer: document.getElementById('mapContainer')
        };

        // ============================================
        // FUNCIONES DE API
        // ============================================

        function getToken() {
            return localStorage.getItem('authToken');
        }

        async function fetchOptimizedRoute() {
            try {
                const response = await fetch(
                    `${CONFIG.baseURL}/routes/${CONFIG.routeId}/optimized`,
                    {
                        headers: {
                            'Authorization': `Bearer ${getToken()}`
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                return await response.json();
            } catch (error) {
                throw new Error(`Error al cargar la ruta: ${error.message}`);
            }
        }

        async function fetchStartRoute() {
            try {
                const response = await fetch(
                    `${CONFIG.baseURL}/routes/${CONFIG.routeId}/start`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${getToken()}`
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                return await response.json();
            } catch (error) {
                throw new Error(`Error al iniciar la ruta: ${error.message}`);
            }
        }

        // ============================================
        // FUNCIONES DE INTERFAZ
        // ============================================

        function showError(message) {
            elements.loadingSection.classList.add('hidden');
            elements.mainContent.classList.add('hidden');
            elements.startSection.classList.add('hidden');
            elements.errorSection.classList.remove('hidden');
            elements.errorSection.innerHTML = `❌ ${message}`;
        }

        function showSuccess(message) {
            elements.successMessage.classList.remove('hidden');
            elements.successMessage.innerHTML = `✅ ${message}`;
            setTimeout(() => {
                elements.successMessage.classList.add('hidden');
            }, 3000);
        }

        function displayRoute(route) {
            // Información
            elements.distanceValue.textContent = `${route.totalDistanceKm} km`;
            elements.stopsCountValue.textContent = route.optimizedRoute.length - 2;
            elements.statusValue.textContent = route.status;
            elements.startDateValue.textContent = new Date(route.startedAt).toLocaleString('es-ES');
            elements.statusBadge.textContent = route.status;

            // Paradas
            elements.stopsList.innerHTML = '';
            route.optimizedRoute.forEach((point, index) => {
                const emoji = getEmoji(point.type);
                const li = document.createElement('li');
                li.className = 'stop-item';
                li.innerHTML = `
                    <div class="stop-number">${index + 1}</div>
                    <div class="stop-details">
                        <strong>${emoji} ${point.name}</strong>
                        <div class="stop-coords">
                            📍 Lat: ${point.lat.toFixed(4)}, Lng: ${point.lng.toFixed(4)}
                        </div>
                    </div>
                `;
                elements.stopsList.appendChild(li);
            });

            // Mostrar contenido
            elements.loadingSection.classList.add('hidden');
            elements.mainContent.classList.remove('hidden');
            elements.startSection.classList.add('hidden');

            // Inicializar mapa (si tienes Google Maps API)
            initializeMap(route.optimizedRoute);
        }

        function getEmoji(type) {
            switch (type) {
                case 'origin':
                    return '🏠';
                case 'destination':
                    return '🎯';
                default:
                    return '🚶';
            }
        }

        function initializeMap(stops) {
            // Placeholder - Implementar con Google Maps
            // Aquí iría el código para inicializar Google Maps
            console.log('Mapa: inicializando con', stops.length, 'paradas');
        }

        // ============================================
        // MANEJADORES DE EVENTOS
        // ============================================

        async function reloadRoute() {
            elements.mainContent.classList.add('hidden');
            elements.loadingSection.classList.remove('hidden');

            try {
                const route = await fetchOptimizedRoute();
                displayRoute(route);
            } catch (error) {
                showError(error.message);
            }
        }

        async function startRoute() {
            elements.startBtn.disabled = true;
            elements.startBtn.textContent = '⏳ Iniciando...';

            try {
                const data = await fetchStartRoute();
                displayRoute(data.route);
                showSuccess('Ruta iniciada exitosamente');
            } catch (error) {
                showError(error.message);
                elements.startBtn.disabled = false;
                elements.startBtn.textContent = '🚀 Iniciar Ruta';
            }
        }

        function downloadRoute() {
            reloadRoute().then(() => {
                // Obtener datos y descargar como JSON
                const dataStr = JSON.stringify(elements.stopsList, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

                const exportFileDefaultName = `ruta-${CONFIG.routeId}-${new Date().toISOString()}.json`;

                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            });
        }

        // ============================================
        // INICIALIZACIÓN
        // ============================================

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                elements.loadingSection.classList.remove('hidden');
                elements.mainContent.classList.add('hidden');
                elements.startSection.classList.add('hidden');
                elements.errorSection.classList.add('hidden');

                const route = await fetchOptimizedRoute();

                if (route.optimizedRoute && route.optimizedRoute.length > 0) {
                    displayRoute(route);
                } else {
                    // Si no tiene ruta aún, mostrar botón para iniciar
                    elements.loadingSection.classList.add('hidden');
                    elements.startSection.classList.remove('hidden');
                }
            } catch (error) {
                showError(error.message);
            }
        });
    </script>
</body>
</html>
